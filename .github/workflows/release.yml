name: release

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - Readme.md
      - readme.md
      - .github/workflows/**
  workflow_dispatch:

# Never let two releases race: each pushes a version commit to main.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test

  # Derives the next version from the commits since the last tag, commits the
  # bump, and tags it. Releases nothing when there are no new commits, which
  # is what keeps its own release commit from triggering another release.
  version:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      released: ${{ steps.bump.outputs.released }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.TOKEN }}
      - id: bump
        run: bash .github/scripts/bump-version.sh gator

  release:
    needs: version
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.tag }}
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.version.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists"
            exit 0
          fi
          bash .github/scripts/release-notes.sh "$tag" > release-notes.md
          gh release create "$tag" --title "$tag" --notes-file release-notes.md
