[package]
name = "gator"
version = "0.2.0"
edition = "2021"
description = "🐊 Shared Rust TUI and tooling primitives for the gator app family"
license = "MIT"
repository = "https://github.com/Yarden-zamir/gator"
keywords = ["tui", "ratatui", "cli", "terminal"]
categories = ["command-line-interface"]

[dependencies]
ansi-to-tui = "8.0"
crossterm = "0.29"
figment = { version = "0.10", features = ["toml"] }
libc = "0.2"
ratatui = "0.30"
schemars = { version = "0.8", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tui-input = { version = "0.15", features = ["crossterm"] }
